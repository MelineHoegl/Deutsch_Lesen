<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reisebüro Fernweh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Draufsicht auf das Reisebüro (passt sich ins Fenster ein) + Seitenleiste mit Postkarten und Steuerkreuz; Prospekte als Overlay */
:root{
  --navy:#1f3a5f;
  --navy-hi:#2c5282;
  --sun:#f6b82e;
  --coral:#ef6f5e;
  --mint:#6cbfa6;
  --sand:#f4e7cc;
  --ink:#22252b;
  --paper:#fffaf0;
  --ok:#2f7d4a;
  --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--navy);color:var(--paper);font-family:var(--body);margin:0;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;padding-block:10px;box-sizing:border-box}
@media (orientation:portrait){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;border-radius:16px;box-shadow:0 0 0 4px var(--navy-hi),0 10px 0 4px #142740}
.chip{position:absolute;left:14px;top:14px;background:var(--sun);color:var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.25);max-width:calc(100% - 28px)}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:18px;font-weight:700;padding:10px 18px;border-radius:14px;max-width:86%;text-align:center;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.side{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
@media (orientation:portrait){.side{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;padding-bottom:6px}}
.brand{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0;color:var(--sun)}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:#b9cbe3;margin-top:6px}
@media (orientation:portrait){.brand{display:none}}
.level{font-family:var(--display);font-size:17px;color:#b9cbe3;text-align:center}
.level b{color:var(--paper);font-size:22px}
.cards{background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px 12px;box-shadow:0 4px 0 #142740}
.cards h3{font-family:var(--display);font-weight:800;margin:0 0 6px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.cards h3 span{font-family:var(--body);font-size:14px;font-variant-numeric:tabular-nums}
.pc-grid{display:grid;grid-template-columns:repeat(4,46px);gap:8px}
.pc{width:46px;height:32px;border-radius:4px;border:2px dashed #c9b994;box-sizing:border-box;position:relative;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:transparent}
.pc.full{border:0;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.2);transform:rotate(-3deg)}
.pc.full::after{content:"";position:absolute;right:3px;top:3px;width:9px;height:11px;background:var(--coral);border-radius:1px}
.dpad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:6px;touch-action:none;align-self:center}
.dpad button{font:inherit;border:0;border-radius:18px;background:var(--sun);color:var(--ink);font-size:30px;box-shadow:0 5px 0 #b9831a;touch-action:none;cursor:pointer;display:grid;place-items:center}
.dpad button.on{transform:translateY(4px);box-shadow:0 1px 0 #b9831a;background:#ffcd59}
.dpad button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.dpad .hub{border-radius:50%;background:var(--navy-hi);margin:14px}

/* Prospekt */
.overlay{position:fixed;inset:0;background:rgba(15,28,46,.72);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));box-sizing:border-box}
.page{width:min(720px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;background:var(--paper);color:var(--ink);border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.4);user-select:text;-webkit-user-select:text}
.hero{position:relative;padding:22px 26px 18px;display:flex;gap:16px;align-items:center;border-radius:18px 18px 0 0;background:var(--band,#8fc9e6)}
.hero svg{width:96px;height:96px;flex:none}
.hero .kicker{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0;opacity:.85}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.4vw,36px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.body{padding:20px 26px 26px;display:flex;flex-direction:column;gap:16px}
.page h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,46px);line-height:1;margin:0;text-wrap:balance}
.page h2.plain{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1.05;margin:0}
.eyebrow{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin:0}
.text{font-size:20px;line-height:1.65;max-width:62ch;columns:1}
.text p{margin:0 0 .7em}.text p:last-child{margin:0}
.lead{font-size:20px;line-height:1.55;margin:0;max-width:62ch}
.qbox{border-top:3px dotted var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.qnum{font-family:var(--display);font-weight:700;font-size:15px;color:#6a6658;margin:0;letter-spacing:.05em;text-transform:uppercase}
.q{font-weight:700;font-size:21px;line-height:1.4;margin:0}
.speech{background:#eaf4fb;border-radius:18px 18px 18px 4px;padding:14px 18px;font-size:20px;line-height:1.5;margin:0;position:relative}
.who{font-family:var(--display);font-weight:800;font-size:18px;margin:0}
.btn{font-family:var(--body);font-size:19px;line-height:1.35;text-align:left;cursor:pointer;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 16px;min-height:56px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn:disabled{cursor:default}
.btn.wrong{background:#fbd5cf;text-decoration:line-through;box-shadow:none;transform:translateY(3px)}
.btn.right{background:#cdeccd;box-shadow:none;transform:translateY(3px)}
.btn.primary{background:var(--coral);color:#fff;border-color:#a8402f;box-shadow:0 4px 0 #a8402f;font-family:var(--display);font-weight:800;font-size:22px;text-align:center}
.answers{display:flex;flex-direction:column;gap:10px}
.feedback{font-size:19px;font-weight:700;margin:0;padding:10px 14px;border-radius:12px}
.feedback.bad{background:#fde0db;color:#80271a}
.feedback.good{background:#d6efd6;color:#1d5a32}
.hint{font-size:18px;background:#fff1b8;border:2px dashed var(--ink);border-radius:12px;padding:10px 14px;margin:0}
.levels{display:flex;gap:16px;flex-wrap:wrap}
.levels .btn{flex:1 1 200px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px;padding:18px}
.levels .shape{display:block;font-size:54px;line-height:1;margin-bottom:4px;font-family:var(--body)}
.postcard{align-self:center;width:min(300px,90%);aspect-ratio:3/2;border-radius:8px;background:var(--band,#8fc9e6);box-shadow:0 8px 0 rgba(0,0,0,.15);position:relative;transform:rotate(-4deg);animation:fly .5s ease-out;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box;overflow:hidden}
.postcard svg{position:absolute;inset:0;width:100%;height:100%}
.postcard .gruss{position:relative;font-family:var(--display);font-weight:800;font-size:24px;color:var(--ink);background:rgba(255,250,240,.9);border-radius:8px;padding:2px 10px}
.postcard .marke{position:absolute;right:12px;top:12px;width:52px;height:62px;background:var(--paper);border:3px dotted var(--coral);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;color:var(--coral)}
@keyframes fly{0%{transform:translateY(40px) rotate(8deg);opacity:0}100%{transform:rotate(-4deg);opacity:1}}
.word{display:flex;gap:6px;flex-wrap:wrap}
.word .pc{width:52px;height:52px;font-size:28px}
.word .pc.full::after{display:none}
.letters{display:flex;gap:10px;flex-wrap:wrap}
.letters .btn{width:60px;height:60px;padding:0;text-align:center;font-family:var(--display);font-weight:800;font-size:28px}
.letters .btn:disabled{opacity:.25}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 170px;text-align:center}
.stats{font-family:var(--display);font-weight:700;font-size:20px;display:grid;grid-template-columns:auto auto;gap:4px 20px;justify-content:start;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.shake,.postcard{animation:none}}
@media (max-width:620px){
  .dpad{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px)}
  .pc-grid{grid-template-columns:repeat(7,36px);gap:5px}.pc{width:36px;height:26px;font-size:15px}
  .hero{padding:16px 18px}.hero svg{width:70px;height:70px}.body{padding:16px 18px 20px}.text{font-size:18px}
}
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Das Reisebüro von oben"></canvas>
    <div class="chip" id="chip">Lies die Prospekte!</div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="side">
    <p class="brand">Reisebüro Fernweh<small>Lesespur · Tourismus in Europa</small></p>
    <div class="level" id="level">Stufe <b>–</b></div>
    <div class="cards">
      <h3>Postkarten <span id="count">0 / 7</span></h3>
      <div class="pc-grid" id="pcs"></div>
    </div>
    <div class="dpad" id="dpad">
      <span></span><button data-d="up" aria-label="nach oben">▲</button><span></span>
      <button data-d="left" aria-label="nach links">◀</button><span class="hub"></span><button data-d="right" aria-label="nach rechts">▶</button>
      <span></span><button data-d="down" aria-label="nach unten">▼</button><span></span>
    </div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="page" id="page"></div></div>

    if(vert){bw=r.w-14;bh=(r.h-16)/n-4;bx=r.x+7;by=r.y+8+i*((r.h-16)/n);}
    else{bw=(r.w-16)/n-4;bh=r.h-14;bx=r.x+8+i*((r.w-16)/n);by=r.y+7;}
    g.fillStyle=r.b.band;rr(g,bx,by,bw,bh,3);g.fill();g.fillStyle="rgba(255,250,240,.75)";g.fillRect(bx+3,by+bh-7,bw-6,3);
  }
  /* Schild */
  const sx=r.tx,sy=r.face==="down"?r.y+r.h+2:r.y-14;
  const label=r.id+" · "+r.b.short;g.font="800 14px 'Baloo 2', sans-serif";const tw=g.measureText(label).width+18;
  let lx=r.face==="right"?r.x+2:r.face==="left"?r.x+r.w-tw-2:sx-tw/2;let ly=r.face==="down"?r.y+r.h+4:r.y-24;
  g.fillStyle=done?"#2f7d4a":"#22252b";rr(g,lx,ly,tw,20,10);g.fill();
  g.fillStyle="#fffaf0";g.textAlign="left";g.textBaseline="middle";g.fillText(label,lx+9,ly+11);
  if(done){g.fillStyle="#2f7d4a";g.beginPath();g.arc(lx+tw,ly+2,9,0,Math.PI*2);g.fill();g.strokeStyle="#fff";g.lineWidth=2.5;g.beginPath();g.moveTo(lx+tw-4,ly+2);g.lineTo(lx+tw-1,ly+5);g.lineTo(lx+tw+4,ly-2);g.stroke();}
  else if(state.level){const p=(Math.sin(t*4+r.id)+1)/2;g.fillStyle="rgba(246,184,46,"+(0.25+p*.35)+")";g.beginPath();g.arc(r.tx,r.ty,12+p*4,0,Math.PI*2);g.fill();
    g.fillStyle="#22252b";g.font="800 16px 'Baloo 2', sans-serif";g.textAlign="center";g.fillText("!",r.tx,r.ty+1);}
}
function drawPerson(g,x,y,ang,col,hair,step,label){
  g.save();g.translate(x,y);
  g.fillStyle="rgba(0,0,0,.18)";g.beginPath();g.ellipse(2,4,15,12,0,0,Math.PI*2);g.fill();
  g.rotate(ang+Math.PI/2);
  const s=Math.sin(step)*5;
  g.fillStyle="#22252b";g.beginPath();g.ellipse(-6,-s,4,6,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(6,s,4,6,0,0,Math.PI*2);g.fill();
  g.fillStyle=col;g.beginPath();g.ellipse(0,0,14,9,0,0,Math.PI*2);g.fill();
  g.fillStyle="#e8b08a";g.beginPath();g.arc(-13,s*.6,3.5,0,Math.PI*2);g.fill();g.beginPath();g.arc(13,-s*.6,3.5,0,Math.PI*2);g.fill();
  g.fillStyle="#e8b08a";g.beginPath();g.arc(0,-1,7.5,0,Math.PI*2);g.fill();
  g.fillStyle=hair;g.beginPath();g.arc(0,1,7.8,0,Math.PI);g.fill();g.beginPath();g.arc(0,-1,7.8,Math.PI*1.05,Math.PI*1.95,true);g.fill();
  g.restore();
  if(label){g.font="700 12px 'Atkinson Hyperlegible', sans-serif";g.textAlign="center";g.textBaseline="middle";const w=g.measureText(label).width+12;
    g.fillStyle="rgba(255,250,240,.95)";rr(g,x-w/2,y-34,w,18,9);g.fill();g.fillStyle="#22252b";g.fillText(label,x,y-25);}
}
function drawKid(g,t){
  drawPerson(g,kid.x,kid.y,kid.ang,"#ef6f5e","#4a2e1c",kid.step,null);
  /* Halstuch des Reisebüros */
  g.save();g.translate(kid.x,kid.y);g.rotate(kid.ang+Math.PI/2);g.fillStyle="#f6b82e";g.beginPath();g.moveTo(-6,-7);g.lineTo(6,-7);g.lineTo(0,-12);g.closePath();g.fill();g.restore();
}
function draw(t){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.drawImage(bg,0,0,RW,RH);
  racks.forEach(r=>drawRack(ctx,r,t));
  /* Kunden */
  if(state.order.length===7&&!state.done){
    const list=state.level===3?[...CUSTOMERS,CUST_EXTRA]:CUSTOMERS;
    list.forEach((c,i)=>{const x=410+i*58-(list.length-3)*29,y=counterSpot.y+80+Math.sin(t*2+i)*1.5;drawPerson(ctx,x,y,-Math.PI/2,c.col,"#2d2a22",0,i===0?"Kunden":null);});
    const p=(Math.sin(t*4)+1)/2;ctx.fillStyle="rgba(246,184,46,"+(0.3+p*.35)+")";ctx.beginPath();ctx.arc(counterSpot.x,counterSpot.y,14+p*4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#22252b";ctx.font="800 16px 'Baloo 2', sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("!",counterSpot.x,counterSpot.y+1);
  }
  drawKid(ctx,t);
}

/* =========================================================
   5) BEWEGUNG
   ========================================================= */
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const R=14;
function hits(x,y){
  if(x<WALL+R||x>RW-WALL-R||y<WALL+R)return true;
  if(y>RH-WALL-R)return true;
  for(const o of obstacles){const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));if((x-cx)**2+(y-cy)**2<R*R)return true;}
  return false;
}
function update(dt,t){
  let vx=0,vy=0;pressed.forEach(d=>{vx+=DIRV[d][0];vy+=DIRV[d][1];});
  if(!overlayOpen&&(vx||vy)){
    const l=Math.hypot(vx,vy);vx/=l;vy/=l;const sp=170*dt;
    const nx=kid.x+vx*sp,ny=kid.y+vy*sp;
    if(!hits(nx,kid.y))kid.x=nx;if(!hits(kid.x,ny))kid.y=ny;
    const ta=Math.atan2(vy,vx);let da=ta-kid.ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;kid.ang+=da*Math.min(1,dt*14);
    kid.step+=dt*14;
  }
  if(overlayOpen||!state.level)return;
  racks.forEach(r=>{const d=Math.hypot(r.tx-kid.x,r.ty-kid.y);
    if(d>52)r.armed=true;
    if(d<26&&r.armed){r.armed=false;
      if(state.solved[r.id])toast("Diesen Prospekt hast du schon gelesen.");
      else{pressed.clear();releaseAll();openBrochure(r.b);}}});
  const dc=Math.hypot(counterSpot.x-kid.x,counterSpot.y-kid.y);
  if(dc>56)counterArmed=true;
  if(dc<28&&counterArmed){counterArmed=false;
    if(state.order.length<7)toast("Lies zuerst alle Prospekte. Dann kommen die Kunden.");
    else if(!state.done){pressed.clear();releaseAll();openCustomers(0);}}
}
function loop(now){const t=now/1000;const dt=lastT?Math.min(.05,t-lastT):.016;lastT=t;update(dt,t);draw(t);requestAnimationFrame(loop);}

/* Steuerkreuz */
const dpad=document.getElementById("dpad");const ptrDir=new Map();
function releaseAll(){ptrDir.clear();dpad.querySelectorAll("button").forEach(b=>b.classList.remove("on"));}
dpad.querySelectorAll("button").forEach(b=>{const d=b.dataset.d;
  b.addEventListener("pointerdown",e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}ptrDir.set(e.pointerId,d);pressed.add(d);b.classList.add("on");});
  const up=e=>{ptrDir.delete(e.pointerId);if(![...ptrDir.values()].includes(d)){pressed.delete(d);b.classList.remove("on");}};
  b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("lostpointercapture",up);b.addEventListener("contextmenu",e=>e.preventDefault());});
dpad.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
const KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
window.addEventListener("keydown",e=>{const d=KEYS[e.key];if(d&&!overlayOpen){e.preventDefault();pressed.add(d);}});
window.addEventListener("keyup",e=>{const d=KEYS[e.key];if(d)pressed.delete(d);});
window.addEventListener("blur",()=>{pressed.clear();releaseAll();});

/* =========================================================
   6) SEITEN
   ========================================================= */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function btn(cls,html,fn){const b=el("button",cls,html);b.type="button";if(fn)b.addEventListener("click",fn);return b;}
function show(){overlayOpen=true;overlay.hidden=false;page.scrollTop=0;}
function hide(){overlayOpen=false;overlay.hidden=true;pressed.clear();releaseAll();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shakePage(){page.classList.remove("shake");void page.offsetWidth;page.classList.add("shake");}
function plainPage(){page.innerHTML="";const b=el("div","body");page.appendChild(b);return b;}

function openStart(){
  const b=plainPage();
  b.appendChild(el("p","eyebrow","Lesespur · Tourismus in Europa"));
  b.appendChild(el("h1",null,"Reisebüro Fernweh"));
  b.appendChild(el("p","lead","Heute ist dein erster Arbeitstag im Reisebüro! Bevor die Kunden kommen, musst du dich gut auskennen."));
  b.appendChild(el("p","lead","An den Wänden stehen <b>sieben Prospektständer</b>. Geh zu jedem Ständer, lies den Prospekt genau und beantworte zwei Fragen. Für jeden Prospekt bekommst du eine <b>Postkarte</b> mit einem Buchstaben."));
  b.appendChild(el("p","lead","Danach warten an der Theke deine ersten <b>Kunden</b>. Berate sie gut!"));
  b.appendChild(el("p","q","Wähle deine Stufe:"));
  const lv=el("div","levels");
  [[2,"▲","Dreieck"],[3,"●","Kreis"]].forEach(([n,s,name])=>{lv.appendChild(btn("btn",'<span class="shape">'+s+'</span>'+name,()=>{state.level=n;state.start=Date.now();renderCards();openHowto();}));});
  b.appendChild(lv);show();
}
function openHowto(){
  const b=plainPage();
  b.appendChild(el("p","eyebrow","So geht’s"));
  b.appendChild(el("h2","plain","Ab an die Arbeit!"));
  b.appendChild(el("p","lead","Halte einen Pfeil auf dem Steuerkreuz gedrückt, dann läufst du durch das Reisebüro."));
  b.appendChild(el("p","lead","Vor jedem Prospektständer, den du noch lesen musst, blinkt ein gelbes <b>!</b>. Stell dich darauf, dann öffnet sich der Prospekt."));
  b.appendChild(el("p","lead","Die Reihenfolge darfst du selbst wählen. Tipp: Die Nummern helfen dir."));
  b.appendChild(btn("btn primary","Los geht’s",hide));show();
}
function openBrochure(B){
  const lvl=state.level,text=lvl===2?B.t2:B.t3,qs=lvl===2?B.q2:B.q3;
  page.innerHTML="";
  const hero=el("div","hero");hero.style.setProperty("--band",B.band);
  hero.innerHTML=ART[B.art]+'<div><p class="kicker">Prospekt '+B.id+' · '+B.kicker+'</p><h2>'+B.title+'</h2></div>';
  page.appendChild(hero);
  const body=el("div","body");page.appendChild(body);
  const tx=el("div","text");text.forEach(p=>tx.appendChild(el("p",null,p)));body.appendChild(tx);
  const area=el("div");area.style.display="flex";area.style.flexDirection="column";area.style.gap="16px";body.appendChild(area);
  const close=btn("btn","Prospekt zurückstellen und später lesen",hide);close.style.textAlign="center";
  function ask(i){
    const q=qs[i];const box=el("div","qbox");
    box.appendChild(el("p","qnum","Frage "+(i+1)+" von 2"));box.appendChild(el("p","q",q.q));
    const list=el("div","answers"),fb=el("p","feedback"),hn=el("p","hint");fb.hidden=true;hn.hidden=true;
    shuffle(q.a.map((a,k)=>({a,ok:k===0}))).forEach(o=>{const b=btn("btn",o.a,()=>{
      if(o.ok){list.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add("right");
        fb.className="feedback good";fb.textContent=i===0?"Richtig! Weiter zur zweiten Frage.":"Richtig! Prospekt geschafft.";fb.hidden=false;hn.hidden=true;
        if(i===0)setTimeout(()=>ask(1),350);else setTimeout(()=>finishBrochure(B),500);}
      else{state.wrong++;b.classList.add("wrong");b.disabled=true;fb.className="feedback bad";fb.textContent="Das stimmt noch nicht. Lies im Prospekt nach.";fb.hidden=false;
        hn.innerHTML="<b>Tipp:</b> "+q.h;hn.hidden=false;shakePage();}
    });list.appendChild(b);});
    box.appendChild(list);box.appendChild(fb);box.appendChild(hn);area.appendChild(box);
    if(i>0)setTimeout(()=>box.scrollIntoView({behavior:"smooth",block:"start"}),60);
  }
  ask(0);body.appendChild(close);show();
}
function finishBrochure(B){
  state.solved[B.id]=true;state.order.push(B.id);renderCards();
  const b=plainPage();
  b.appendChild(el("p","eyebrow","Prospekt "+B.id+" geschafft"));
  b.appendChild(el("h2","plain",B.title));
  const pc=el("div","postcard");pc.style.setProperty("--band",B.band);pc.innerHTML=ART[B.art]+'<span class="gruss">Viele Grüße!</span><span class="marke">'+B.letter+'</span>';
  b.appendChild(pc);
  b.appendChild(el("p","lead","Du bekommst eine Postkarte mit dem Buchstaben <b>"+B.letter+"</b>."));
  const left=7-state.order.length;
  b.appendChild(btn("btn primary",left?("Weiter (noch "+left+" Prospekt"+(left>1?"e":"")+")"):"Zu den Kunden an der Theke",()=>{hide();if(!left)toast("Die ersten Kunden sind da! Geh zur Theke.",4500);}));
  show();
}
function openCustomers(idx){
  const list=state.level===3?[...CUSTOMERS,CUST_EXTRA]:CUSTOMERS;
  if(idx>=list.length){openFinal();return;}
  const c=list[idx];
  const b=plainPage();
  b.appendChild(el("p","eyebrow","Kundenberatung · "+(idx+1)+" von "+list.length));
  b.appendChild(el("p","who",c.name+" sagt:"));
  b.appendChild(el("p","speech","„"+c.say+"“"));
  b.appendChild(el("p","q","Welche Reise empfiehlst du?"));
  const ans=el("div","answers"),fb=el("p","feedback"),hn=el("p","hint");fb.hidden=true;hn.hidden=true;
  shuffle(c.a.map((a,k)=>({a,ok:k===0}))).forEach(o=>{const bt=btn("btn",o.a,()=>{
    if(o.ok){ans.querySelectorAll("button").forEach(x=>x.disabled=true);bt.classList.add("right");fb.className="feedback good";fb.textContent="Super beraten! "+c.name+" bucht die Reise.";fb.hidden=false;hn.hidden=true;
      const nx=btn("btn primary",idx+1<list.length?"Nächster Kunde":"Feierabend!",()=>openCustomers(idx+1));b.appendChild(nx);setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"end"}),60);}
    else{state.wrong++;bt.classList.add("wrong");bt.disabled=true;fb.className="feedback bad";fb.textContent="Hm, das passt nicht ganz zu dem, was "+c.name+" möchte.";fb.hidden=false;hn.innerHTML="<b>Tipp:</b> "+c.h;hn.hidden=false;shakePage();}
  });ans.appendChild(bt);});
  b.appendChild(ans);b.appendChild(fb);b.appendChild(hn);show();
}
function openFinal(){
  state.custDone=true;let picked=[];
  const b=plainPage();
  b.appendChild(el("p","eyebrow","Feierabend"));
  b.appendChild(el("h2","plain","Das Lösungswort"));
  b.appendChild(el("p","lead","Lege deine sieben Postkarten in die richtige Reihenfolge. Das Wort steht auch auf dem Schild des Reisebüros."));
  const word=el("div","word"),letters=el("div","letters"),fb=el("p","feedback");fb.hidden=true;
  function paint(){word.innerHTML="";for(let i=0;i<WORD.length;i++){const d=el("div","pc"+(picked[i]?" full":""),picked[i]?picked[i].ch:"");if(picked[i])d.style.background=BRO[picked[i].id-1].band;word.appendChild(d);}}
  let pool=shuffle(BRO.map(B=>({ch:B.letter,id:B.id})));if(pool.map(p=>p.ch).join("")===WORD)pool.reverse();
  pool.forEach(p=>{const bt=btn("btn",p.ch,()=>{if(picked.length>=WORD.length)return;picked.push(p);bt.disabled=true;paint();
    if(picked.length===WORD.length){if(picked.map(x=>x.ch).join("")===WORD)setTimeout(openEnd,500);
      else{state.wrong++;fb.className="feedback bad";fb.textContent="Das ergibt noch kein Wort. Versuch es noch einmal!";fb.hidden=false;shakePage();setTimeout(()=>{picked.forEach(x=>x.btn.disabled=false);picked=[];paint();},900);}}});
    p.btn=bt;letters.appendChild(bt);});
  paint();b.appendChild(word);b.appendChild(letters);b.appendChild(fb);
  b.appendChild(btn("btn","Letzte Postkarte zurücklegen",()=>{const p=picked.pop();if(p)p.btn.disabled=false;paint();fb.hidden=true;}));
  show();
}
function openEnd(){
  state.done=true;renderCards();
  const min=Math.max(1,Math.round((Date.now()-state.start)/60000));
  const b=plainPage();
  b.appendChild(el("p","eyebrow","Erster Arbeitstag geschafft"));
  b.appendChild(el("h1",null,"FERNWEH!"));
  b.appendChild(el("p","lead","„Fernweh“ ist die Sehnsucht nach fernen Orten. Du hast alle Prospekte gelesen und deine Kunden gut beraten. Zeige diesen Bildschirm deiner Lehrkraft."));
  const st=el("div","stats");
  st.innerHTML="<span>Stufe</span><span>"+(state.level===2?"▲ Dreieck":"● Kreis")+"</span><span>Lösungswort</span><span>FERNWEH</span><span>Kunden beraten</span><span>"+(state.level===3?4:3)+"</span><span>Fehlversuche</span><span>"+state.wrong+"</span><span>Zeit</span><span>ca. "+min+" Min.</span>";
  b.appendChild(st);
  b.appendChild(btn("btn primary","Noch einmal spielen",()=>{state.level=null;state.solved={};state.order=[];state.wrong=0;state.done=false;state.custDone=false;kid.x=490;kid.y=470;racks.forEach(r=>r.armed=true);counterArmed=true;renderCards();openStart();}));
  show();
}

/* =========================================================
   7) START
   ========================================================= */
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(()=>({state:JSON.parse(JSON.stringify(state)),kid:{x:kid.x,y:kid.y}}));}catch(_){}}
function boot(data){
  resize();
  const go=()=>{buildRoom();};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildRoom();});
  go();
  if(data&&data.state&&data.state.level){Object.assign(state,data.state);kid.x=data.kid.x;kid.y=data.kid.y;renderCards();if(state.done)openEnd();else hide();}
  else{renderCards();openStart();}
  requestAnimationFrame(loop);
}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data?hot.data:{});
})();
