<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expedition Europa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,700;1,500;1,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Kartenfenster (Kamera folgt Fahrzeug) + Seitenleiste mit Expeditionsbuch und Steuerkreuz; Lesetexte als Feldbuch-Seiten im Overlay */
:root{
  --sea:#2c6e7f;
  --shallow:#5fa3ad;
  --land:#e4dcb8;
  --ink:#2d2a22;
  --paper:#f7f0dc;
  --paper-edge:#d9cba3;
  --signal:#e2662a;      /* Expeditions-Orange */
  --khaki:#8f8550;
  --ok:#3f8a4a;
  --bad:#c0452f;
  --panel:#24363b;
  --panel-hi:#35505a;
  --display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--panel);color:var(--paper);font-family:var(--body);margin:0;
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(12px, env(safe-area-inset-left, 0px));
  padding-right:max(12px, env(safe-area-inset-right, 0px));
}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;padding-block:10px;box-sizing:border-box}
@media (orientation:portrait){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
.stage{position:relative;min-width:0;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);box-shadow:0 0 0 3px var(--panel-hi)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;left:10px;top:10px;background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px 8px 10px;font-family:var(--display);font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25);max-width:calc(100% - 200px)}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--signal);flex:none}
#mini{position:absolute;right:10px;top:10px;width:170px;height:120px;border-radius:8px;border:3px solid var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.25);background:var(--sea)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:18px;font-weight:700;padding:10px 18px;border-radius:12px;max-width:86%;text-align:center;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.side{display:flex;flex-direction:column;gap:14px;align-items:stretch;justify-content:center;min-width:0}
@media (orientation:portrait){.side{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;padding-bottom:6px}}
.brand{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;color:var(--paper);margin:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:#a9c3c6;margin-top:4px}
@media (orientation:portrait){.brand{display:none}}
.book{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px 12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.book h3{font-family:var(--display);margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.book h3 span{font-family:var(--body);font-size:14px;font-variant-numeric:tabular-nums}
.stamps{display:grid;grid-template-columns:repeat(4,44px);gap:8px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed #b4a57a;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:transparent;box-sizing:border-box}
.stamp.full{border:3px solid var(--signal);color:var(--signal);transform:rotate(-8deg);background:rgba(226,102,42,.08)}
.dpad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:6px;touch-action:none;align-self:center}
.dpad button{
  font:inherit;border:0;border-radius:14px;background:var(--paper);color:var(--ink);font-size:30px;
  box-shadow:0 5px 0 #a69769;touch-action:none;cursor:pointer;display:grid;place-items:center;
}
.dpad button.on{transform:translateY(4px);box-shadow:0 1px 0 #a69769;background:#efe3c2}
.dpad button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.dpad .hub{border-radius:50%;background:var(--panel-hi);margin:14px}
.level{font-family:var(--display);font-size:16px;color:#cfe0e2;text-align:center}
.level b{color:var(--paper);font-size:22px}

/* Overlay: Feldbuch */
.overlay{position:fixed;inset:0;background:rgba(18,30,34,.7);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));box-sizing:border-box}
.page{
  width:min(720px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;
  background:var(--paper);color:var(--ink);border-radius:6px 16px 16px 6px;
  box-shadow:inset 14px 0 0 var(--paper-edge),0 10px 30px rgba(0,0,0,.4);
  padding:26px 26px 26px 40px;display:flex;flex-direction:column;gap:16px;user-select:text;-webkit-user-select:text;
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(44,110,127,.13) 33px 34px);
}
.page h1,.page h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
.page h1{font-size:clamp(30px,5vw,44px)}
.page h2{font-size:clamp(24px,3.8vw,32px)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin:0}
.place{font-size:16px;color:#5f5a48;margin:-8px 0 0}
.text{font-size:20px;line-height:1.65;max-width:62ch}
.text p{margin:0 0 .7em}.text p:last-child{margin:0}
.lead{font-size:20px;line-height:1.55;margin:0;max-width:62ch}
.qbox{border-top:3px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.qnum{font-family:var(--display);font-weight:700;font-size:15px;color:#5f5a48;margin:0;letter-spacing:.05em;text-transform:uppercase}
.q{font-weight:700;font-size:21px;line-height:1.4;margin:0}
.btn{
  font-family:var(--body);font-size:19px;line-height:1.35;text-align:left;cursor:pointer;color:var(--ink);
  background:#fffaf0;border:2px solid var(--ink);border-radius:12px;padding:14px 16px;min-height:56px;
  box-shadow:0 4px 0 var(--ink);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn:disabled{cursor:default}
.btn.wrong{background:#f3cfc4;text-decoration:line-through;box-shadow:none;transform:translateY(3px)}
.btn.right{background:#cfe8c7;box-shadow:none;transform:translateY(3px)}
.btn.primary{background:var(--signal);color:#fff;border-color:#9b3f14;box-shadow:0 4px 0 #9b3f14;font-family:var(--display);font-weight:700;font-size:22px;text-align:center}
.answers{display:flex;flex-direction:column;gap:10px}
.feedback{font-size:19px;font-weight:700;margin:0;padding:10px 14px;border-radius:10px}
.feedback.bad{background:#f6dbd2;color:#7a2512}
.feedback.good{background:#d8eed1;color:#1e5226}
.hint{font-size:18px;background:#fff1b8;border:2px dashed var(--ink);border-radius:10px;padding:10px 14px;margin:0}
.levels{display:flex;gap:16px;flex-wrap:wrap}
.levels .btn{flex:1 1 200px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;padding:20px}
.levels .shape{display:block;font-size:54px;line-height:1;margin-bottom:6px;font-family:var(--body)}
.vehicles{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.vehicles figure{margin:0;display:flex;gap:10px;align-items:center;font-size:18px}
.vehicles canvas{width:64px;height:64px;background:var(--shallow);border-radius:12px}
.stampbig{align-self:center;width:120px;height:120px;border-radius:50%;border:5px solid var(--signal);color:var(--signal);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:64px;transform:rotate(-10deg);animation:stamp .45s ease-out}
@keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}70%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
.newlabels{font-size:17px;margin:0;color:#3d5a60}
.word{display:flex;gap:6px;flex-wrap:wrap}
.word .stamp{width:52px;height:52px;font-size:28px}
.letters{display:flex;gap:10px;flex-wrap:wrap}
.letters .btn{width:60px;height:60px;padding:0;text-align:center;font-family:var(--display);font-weight:700;font-size:28px}
.letters .btn:disabled{opacity:.25}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 170px;text-align:center}
.stats{font-family:var(--display);font-size:19px;display:grid;grid-template-columns:auto auto;gap:6px 20px;justify-content:start;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.shake,.stampbig{animation:none}}
@media (max-width:620px){
  .dpad{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px)}
  .stamps{grid-template-columns:repeat(8,30px);gap:5px}.stamp{width:30px;height:30px;font-size:16px}
  #mini{width:120px;height:85px}.chip{font-size:15px;max-width:calc(100% - 150px)}
  .page{padding:20px 18px 20px 30px}.text{font-size:18px}
}
</style>
</head>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Karte von Europa"></canvas>
    <div class="chip" id="chip"><span class="dot"></span><span id="chipText">Basislager Regensburg</span></div>
    <canvas id="mini" width="340" height="240" aria-hidden="true"></canvas>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="side">
    <p class="brand">Expedition Europa<small>Lesespur · Länder, Gebirge, Flüsse</small></p>
    <div class="level" id="level">Stufe <b>–</b></div>
    <div class="book">
      <h3>Expeditionsbuch <span id="count">0 / 8</span></h3>
      <div class="stamps" id="stamps"></div>
    </div>
    <div class="dpad" id="dpad">
      <span></span><button data-d="up" aria-label="nach oben">▲</button><span></span>
      <button data-d="left" aria-label="nach links">◀</button><span class="hub"></span><button data-d="right" aria-label="nach rechts">▶</button>
      <span></span><button data-d="down" aria-label="nach unten">▼</button><span></span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="page" id="page"></div></div>

function smoothPath(ctx,pts,closed){
  const p=pts.map(([lo,la])=>P(lo,la)),n=p.length;ctx.beginPath();
  if(!closed){ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my);}ctx.lineTo(p[n-1][0],p[n-1][1]);return;}
  const m=i=>{const a=p[(i+n)%n],b=p[(i+1)%n];return[(a[0]+b[0])/2,(a[1]+b[1])/2];};
  let s=m(n-1);ctx.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(i);ctx.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1]);}ctx.closePath();
}

  const r=rng(7);g.strokeStyle="rgba(255,255,255,.09)";g.lineWidth=1.5;
  for(let i=0;i<1100;i++){const x=r()*W,y=r()*H;g.beginPath();g.arc(x,y,7,Math.PI*1.15,Math.PI*1.85);g.stroke();}
  /* Flachwasser + Land */
  g.lineJoin="round";g.lineCap="round";
  g.strokeStyle=C.shallow;g.lineWidth=16;LAND.forEach(poly=>{smoothPath(g,poly,true);g.stroke();});
  g.fillStyle=C.land;LAND.forEach(poly=>{smoothPath(g,poly,true);g.fill();});
  INNER_SEAS.forEach(poly=>{g.save();smoothPath(g,poly,true);g.fillStyle=C.sea;g.fill();g.clip();g.strokeStyle=C.shallow;g.lineWidth=16;g.stroke();g.restore();});
  /* Landtextur */
  const r2=rng(21);
  for(let i=0;i<9000;i++){const x=Math.floor(r2()*W),y=Math.floor(r2()*H);if(!isLandPx(x,y))continue;g.fillStyle=r2()<.5?"rgba(120,140,70,.10)":"rgba(255,255,255,.18)";g.beginPath();g.arc(x,y,2+r2()*5,0,Math.PI*2);g.fill();}
  /* Küstenlinie */
  g.strokeStyle=C.coast;g.lineWidth=1.6;
  LAND.forEach(poly=>{smoothPath(g,poly,true);g.stroke();});
  INNER_SEAS.forEach(poly=>{smoothPath(g,poly,true);g.stroke();});
  /* Gebirge */
  const r3=rng(99);
  Object.values(MOUNTAINS).forEach(mt=>{
    const pts=mt.pts.map(([lo,la])=>P(lo,la));
    for(let s=0;s<pts.length-1;s++){
      const [x1,y1]=pts[s],[x2,y2]=pts[s+1],len=Math.hypot(x2-x1,y2-y1),steps=Math.ceil(len/11);
      const nx=-(y2-y1)/len,ny=(x2-x1)/len;
      for(let k=0;k<steps;k++){
        const t=k/steps,bx=x1+(x2-x1)*t,by=y1+(y2-y1)*t;
        for(let j=0;j<2;j++){
          const off=(r3()-.5)*mt.w,x=bx+nx*off+(r3()-.5)*6,y=by+ny*off+(r3()-.5)*6;

    }
  });
  /* Flüsse */
  Object.values(RIVERS).forEach(rv=>{smoothPath(g,rv,false);g.strokeStyle=C.river;g.lineWidth=6;g.stroke();g.strokeStyle=C.riverHi;g.lineWidth=2;g.stroke();});
  STRAITS.forEach(s=>{smoothPath(g,s,false);g.strokeStyle=C.shallow;g.lineWidth=7;g.stroke();});
}
function peak(g,x,y,h,snow){
  const w=h*1.25;
  g.fillStyle="rgba(60,40,20,.18)";g.beginPath();g.ellipse(x+2,y+1,w*.55,2.5,0,0,Math.PI*2);g.fill();
  g.fillStyle=C.mL;g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x,y-h);g.lineTo(x,y);g.closePath();g.fill();
  g.fillStyle=C.mD;g.beginPath();g.moveTo(x,y-h);g.lineTo(x+w/2,y);g.lineTo(x,y);g.closePath();g.fill();
  if(snow){g.fillStyle=C.snow;g.beginPath();g.moveTo(x,y-h);g.lineTo(x-w*.18,y-h*.64);g.lineTo(x-w*.04,y-h*.7);g.lineTo(x+w*.06,y-h*.6);g.lineTo(x+w*.18,y-h*.64);g.closePath();g.fill();}
}
function isLandPx(x,y){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return false;return maskData[(y*W+x)*4]>128;}

  g.fillStyle="#9a8a4f";rr(g,-15,-9,30,18,4);g.fill();
  g.fillStyle="#7a6d3c";rr(g,4,-8,10,16,3);g.fill();          /* Motorhaube */
  g.fillStyle="#bfe2ec";rr(g,0,-7,4,14,1);g.fill();           /* Scheibe */

  g.fillStyle="#2a2a28";g.beginPath();g.arc(-16,0,4.5,0,Math.PI*2);g.fill(); /* Reserverad */
  g.fillStyle="#555";g.beginPath();g.arc(-16,0,2,0,Math.PI*2);g.fill();

  g.fillStyle="#e2662a";g.beginPath();g.moveTo(-10,-16);g.lineTo(-3+Math.sin(t*8)*1.5,-15);g.lineTo(-10,-12.5);g.closePath();g.fill();
  g.restore();

function drawBoat(g,x,y,ang,t){
  g.save();g.translate(x,y+Math.sin(t*3)*.8);g.rotate(ang+Math.sin(t*2.2)*.03);
  g.fillStyle="rgba(0,0,0,.2)";g.beginPath();g.ellipse(2,3,19,9,0,0,Math.PI*2);g.fill();
  g.fillStyle="#f7f4ec";g.beginPath();g.moveTo(-16,-8);g.lineTo(8,-8);g.quadraticCurveTo(20,0,8,8);g.lineTo(-16,8);g.closePath();g.fill();
  g.strokeStyle="#2d2a22";g.lineWidth=1.2;g.stroke();
  g.fillStyle="#e2662a";g.beginPath();g.moveTo(-16,-8);g.lineTo(8,-8);g.lineTo(9.5,-5.5);g.lineTo(-16,-5.5);g.closePath();g.fill();
  g.beginPath();g.moveTo(-16,8);g.lineTo(8,8);g.lineTo(9.5,5.5);g.lineTo(-16,5.5);g.closePath();g.fill();

const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function nextTarget(){
  const open=stations.filter(s=>!state.solved[s.id]);
  if(!open.length)return {x:base[0],y:base[1],name:"Zurück ins Basislager Regensburg",base:true};
  let best=null,bd=1e12;open.forEach(s=>{const d=Math.hypot(s.x-car.x,s.y-car.y);if(d<bd){bd=d;best=s;}});
  return {x:best.x,y:best.y,name:"Nächstes Fähnchen: Nr. "+best.id,id:best.id};
}
function update(dt,t){
  let vx=0,vy=0;pressed.forEach(d=>{vx+=DIRV[d][0];vy+=DIRV[d][1];});
  if(!overlayOpen&&(vx||vy)){
    const l=Math.hypot(vx,vy);vx/=l;vy/=l;const sp=125*dt;
    car.x=Math.max(14,Math.min(W-14,car.x+vx*sp));car.y=Math.max(14,Math.min(H-14,car.y+vy*sp));
    const ta=Math.atan2(vy,vx);let da=ta-car.ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;car.ang+=da*Math.min(1,dt*12);
    const onLand=isLandPx(car.x,car.y);
    if(onLand===car.boat){
      car.boat=!onLand;for(let i=0;i<10;i++)puffs.push({x:car.x,y:car.y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,life:1});
      if(onLand&&!seen.land){seen.land=true;toast("Land in Sicht! Du steigst in den Expeditions-Jeep.");}
      if(!onLand&&!seen.water){seen.water=true;toast("Wasser! Du steigst ins Forschungsboot.");}
    }
    if(car.boat){wakeAcc+=dt;if(wakeAcc>.05){wakeAcc=0;wake.push({x:car.x-Math.cos(car.ang)*15,y:car.y-Math.sin(car.ang)*15,life:1});}}
    else{wakeAcc+=dt;if(wakeAcc>.09){wakeAcc=0;wake.push({x:car.x-Math.cos(car.ang)*15,y:car.y-Math.sin(car.ang)*15,life:.6,dust:true});}}
  }
  for(let i=wake.length-1;i>=0;i--){wake[i].life-=dt*1.1;if(wake[i].life<=0)wake.splice(i,1);}
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.6;if(p.life<=0)puffs.splice(i,1);}
  /* Stationen */
  if(!overlayOpen&&state.level){
    stations.forEach(s=>{const d=Math.hypot(s.x-car.x,s.y-car.y);
      if(d>46)s.armed=true;
      if(d<22&&s.armed&&!state.solved[s.id]){s.armed=false;pressed.clear();releaseAll();openStation(s);}
      else if(d<22&&s.armed&&state.solved[s.id]){s.armed=false;toast("Hier hast du schon geforscht: "+s.title);} });
    const db=Math.hypot(base[0]-car.x,base[1]-car.y);
    if(db>50)baseArmed=true;
    if(db<24&&baseArmed){baseArmed=false;
      if(state.order.length===8){pressed.clear();releaseAll();openFinal();}
      else toast("Basislager: Du hast "+state.order.length+" von 8 Stempeln. Fahre weiter!");}
  }
  /* Kamera */
  const vw=cssW/zoom,vh=cssH/zoom;
  camX=Math.max(0,Math.min(W-vw,car.x-vw/2));camY=Math.max(0,Math.min(H-vh,car.y-vh/2));
  if(vw>W)camX=(W-vw)/2;if(vh>H)camY=(H-vh)/2;
}
const FONTS={sea:"italic 600 16px 'Zilla Slab', Georgia, serif",small:"italic 600 13px 'Zilla Slab', Georgia, serif",region:"italic 500 14px 'Zilla Slab', Georgia, serif",
  country:"700 14px 'Zilla Slab', Georgia, serif",mount:"italic 700 15px 'Zilla Slab', Georgia, serif",peak:"700 12px 'Atkinson Hyperlegible', Arial, sans-serif",
  river:"italic 700 14px 'Zilla Slab', Georgia, serif",city:"700 13px 'Atkinson Hyperlegible', Arial, sans-serif"};
function drawLabel(g,key,t){
  const [txt,lo,la,type]=LABELS[key];const [x,y]=P(lo,la);
  const age=revealTime[key]?(t-revealTime[key]):99;const pop=age<2.5?(1+Math.max(0,.35*(1-age/0.6))):1;
  g.save();g.translate(x,y);g.scale(pop,pop);g.font=FONTS[type];g.textAlign="center";g.textBaseline="middle";g.lineJoin="round";
  let fill=C.ink,halo="rgba(228,220,184,.92)",dy=0,text=txt;
  if(type==="sea"||type==="small"){fill="#e9f6f4";halo="rgba(44,110,127,.85)";}
  if(type==="country"){text=txt.toUpperCase();fill="#4a4330";}
  if(type==="mount"){fill="#6a4524";}
  if(type==="river"){fill="#1d5c80";}
  if(type==="region"){fill="#6a6248";}
  if(type==="city"||type==="peak"){
    if(type==="city"){g.fillStyle=C.ink;g.beginPath();g.arc(0,0,4,0,Math.PI*2);g.fill();g.fillStyle="#fff";g.beginPath();g.arc(0,0,1.7,0,Math.PI*2);g.fill();}

    g.textAlign="left";dy=0;g.translate(8,0);
  }
  if(age<2.5){g.shadowColor="rgba(226,102,42,.9)";g.shadowBlur=12*(1-age/2.5);}
  g.strokeStyle=halo;g.lineWidth=4;g.strokeText(text,0,dy);g.shadowBlur=0;g.fillStyle=fill;g.fillText(text,0,dy);
  g.restore();
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.sea;ctx.fillRect(0,0,cv.width,cv.height);
  const s=dpr*zoom;ctx.setTransform(s,0,0,s,-camX*s,-camY*s);
  const vw=cssW/zoom,vh=cssH/zoom;
  const sx=Math.max(0,Math.floor(camX)),sy=Math.max(0,Math.floor(camY)),sw=Math.min(W-sx,Math.ceil(vw)+2),sh=Math.min(H-sy,Math.ceil(vh)+2);
  if(sw>0&&sh>0)ctx.drawImage(world,sx,sy,sw,sh,sx,sy,sw,sh);
  /* statische Kontinente */
  ctx.font="700 22px 'Zilla Slab', Georgia, serif";ctx.textAlign="center";ctx.fillStyle="rgba(45,42,34,.35)";
  STATIC_LABELS.forEach(([txt,lo,la])=>{const[x,y]=P(lo,la);ctx.fillText(txt,x,y);});
  /* Beschriftungen */
  Object.keys(state.revealed).forEach(k=>drawLabel(ctx,k,t));
  /* Spuren */
  wake.forEach(w=>{ctx.globalAlpha=Math.max(0,w.life)*.7;ctx.strokeStyle=w.dust?"#b9a77a":"#ffffff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y,(w.dust?3:4)+(1-w.life)*(w.dust?6:12),0,Math.PI*2);ctx.stroke();});
  ctx.globalAlpha=1;
  /* Basislager */
  drawCamp(ctx,base[0],base[1],t);
  /* Stationen */
  stations.forEach(st=>drawFlag(ctx,st,t));
  /* Puffs */
  puffs.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life)*.8;ctx.fillStyle="#fffaf0";ctx.beginPath();ctx.arc(p.x,p.y,4+(1-p.life)*6,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  /* Fahrzeug */
  if(car.boat)drawBoat(ctx,car.x,car.y,car.ang,t);else drawJeep(ctx,car.x,car.y,car.ang,t);
  /* Zielpfeil */
  if(state.level&&!state.done){
    const tg=nextTarget();const scx=(tg.x-camX)*zoom,scy=(tg.y-camY)*zoom;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const m=34;
    if(scx<m||scy<m||scx>cssW-m||scy>cssH-m){
      const cx=cssW/2,cy=cssH/2,a=Math.atan2(scy-cy,scx-cx);
      const r=Math.min((cssW/2-m)/Math.abs(Math.cos(a)||1e-6),(cssH/2-m)/Math.abs(Math.sin(a)||1e-6));
      const ax=cx+Math.cos(a)*r,ay=cy+Math.sin(a)*r;
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);ctx.fillStyle="#e2662a";ctx.strokeStyle="#fff";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-13);ctx.lineTo(-4,0);ctx.lineTo(-10,13);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();
    }
    document.getElementById("chipText").textContent=tg.name;
  }
  drawMini(t);
}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function btn(cls,html,fn){const b=el("button",cls,html);b.type="button";if(fn)b.addEventListener("click",fn);return b;}
function show(){overlayOpen=true;overlay.hidden=false;page.scrollTop=0;}
function hide(){overlayOpen=false;overlay.hidden=true;pressed.clear();releaseAll();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shakePage(){page.classList.remove("shake");void page.offsetWidth;page.classList.add("shake");}

function vehiclePreview(kind){const c=document.createElement("canvas");c.width=128;c.height=128;const g=c.getContext("2d");g.scale(2,2);
  if(kind==="boat")drawBoat(g,32,32,-.5,0);else{g.fillStyle="#e4dcb8";g.fillRect(0,0,64,64);drawJeep(g,32,32,-.5,0);}return c;}

function openStart(){
  page.innerHTML="";
  page.appendChild(el("p","eyebrow","Lesespur · Europa"));
  page.appendChild(el("h1",null,"Expedition Europa"));
  page.appendChild(el("p","lead","Du bist Forscherin oder Forscher und erkundest Europa. Auf deiner Karte stehen <b>acht orange Fähnchen</b>. An jedem Fähnchen wartet eine Seite aus dem Feldbuch. Lies sie genau und beantworte zwei Fragen."));
  const v=el("div","vehicles");
  const f1=el("figure");f1.appendChild(vehiclePreview("boat"));f1.appendChild(el("span",null,"Auf Meeren und Flüssen fährst du das <b>Forschungsboot</b>."));
  const f2=el("figure");f2.appendChild(vehiclePreview("jeep"));f2.appendChild(el("span",null,"An Land fährst du den <b>Expeditions-Jeep</b>."));
  v.appendChild(f1);v.appendChild(f2);page.appendChild(v);
  page.appendChild(el("p","lead","Für jede geschaffte Station bekommst du einen <b>Stempel mit Buchstaben</b>. Mit allen acht Stempeln fährst du zurück ins Basislager und findest das Lösungswort."));
  page.appendChild(el("p","q","Wähle deine Stufe:"));
  const lv=el("div","levels");
  [[2,"▲","Dreieck"],[3,"●","Kreis"]].forEach(([n,s,name])=>{
    lv.appendChild(btn("btn",'<span class="shape">'+s+'</span>'+name,()=>{state.level=n;state.start=Date.now();renderBook();openHowto();}));
  });
  page.appendChild(lv);show();
}
function openHowto(){
  page.innerHTML="";
  page.appendChild(el("p","eyebrow","So steuerst du"));
  page.appendChild(el("h2",null,"Leinen los!"));
  page.appendChild(el("p","lead","Halte einen Pfeil auf dem Steuerkreuz gedrückt, dann fährst du los. Mit zwei Fingern kannst du auch schräg fahren."));
  page.appendChild(el("p","lead","Der <b>orange Pfeil</b> am Kartenrand zeigt dir den Weg zum nächsten Fähnchen. Oben rechts siehst du die ganze Europakarte im Kleinen."));
  page.appendChild(el("p","lead","Du startest im Basislager in <b>Regensburg</b> an der Donau. Wohin fährst du zuerst?"));
  page.appendChild(btn("btn primary","Expedition starten",()=>{hide();toast("Du bist im Forschungsboot auf der Donau. Fahre los!");}));
  show();
}

function openStation(s){
  const lvl=state.level,text=lvl===2?s.t2:s.t3,qs=lvl===2?s.q2:s.q3;
  page.innerHTML="";
  page.appendChild(el("p","eyebrow","Fähnchen "+s.id+" von 8"));
  page.appendChild(el("h2",null,s.title));
  page.appendChild(el("p","place","📍 "+s.place));
  const tx=el("div","text");text.forEach(p=>tx.appendChild(el("p",null,p)));page.appendChild(tx);
  const area=el("div");area.style.display="flex";area.style.flexDirection="column";area.style.gap="16px";page.appendChild(area);
  const close=btn("btn","Seite schließen und später wiederkommen",()=>{hide();});close.style.textAlign="center";
  function ask(i){
    const q=qs[i];let tries=0;
    const box=el("div","qbox");
    box.appendChild(el("p","qnum","Frage "+(i+1)+" von 2"));
    box.appendChild(el("p","q",q.q));
    const list=el("div","answers");const fb=el("p","feedback");fb.hidden=true;const hn=el("p","hint");hn.hidden=true;
    shuffle(q.a.map((a,k)=>({a,ok:k===0}))).forEach(o=>{
      const b=btn("btn",o.a,()=>{
        if(o.ok){
          list.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add("right");
          fb.className="feedback good";fb.textContent=i===0?"Richtig! Weiter zur zweiten Frage.":"Richtig! Station geschafft.";fb.hidden=false;hn.hidden=true;
          if(i===0){setTimeout(()=>{ask(1);},350);}else{setTimeout(()=>finishStation(s),500);}
        }else{
          tries++;state.wrong++;b.classList.add("wrong");b.disabled=true;
          fb.className="feedback bad";fb.textContent="Das stimmt noch nicht. Lies im Text nach.";fb.hidden=false;
          hn.innerHTML="<b>Tipp:</b> "+q.h;hn.hidden=false;shakePage();
        }
      });list.appendChild(b);
    });
    box.appendChild(list);box.appendChild(fb);box.appendChild(hn);
    area.appendChild(box);
    if(i>0)setTimeout(()=>box.scrollIntoView({behavior:"smooth",block:"start"}),60);
  }
  ask(0);page.appendChild(close);show();
}
function finishStation(s){
  state.solved[s.id]=true;state.order.push(s.id);renderBook();
  const now=performance.now()/1000;
  s.labels.forEach(k=>{state.revealed[k]=true;revealTime[k]=now+0.2;});
  page.innerHTML="";
  page.appendChild(el("p","eyebrow","Station geschafft"));
  page.appendChild(el("h2",null,s.title));
  page.appendChild(el("div","stampbig",s.letter));
  page.appendChild(el("p","lead","Du bekommst den Stempel mit dem Buchstaben <b>"+s.letter+"</b>."));
  const names=s.labels.map(k=>LABELS[k][0].replace(/ \d[\d ]* m$/,"")).join(", ");
  page.appendChild(el("p","newlabels","<b>Neu auf deiner Karte:</b> "+names));
  const left=8-state.order.length;
  page.appendChild(btn("btn primary",left?("Weiterfahren (noch "+left+" Fähnchen)"):"Zurück ins Basislager",()=>{hide();if(!left)toast("Alle Stempel gesammelt! Fahre zurück ins Basislager nach Regensburg.",4500);}));
  show();
}
function openFinal(){
  let picked=[];
  page.innerHTML="";
  page.appendChild(el("p","eyebrow","Basislager Regensburg"));
  page.appendChild(el("h2",null,"Das Lösungswort"));
  page.appendChild(el("p","lead","Du hast alle acht Stempel. Bring die Buchstaben in die richtige Reihenfolge. Tipp: Das Wort beschreibt, was du auf dieser Expedition bist."));
  const word=el("div","word"),letters=el("div","letters"),fb=el("p","feedback");fb.hidden=true;
  function paint(){word.innerHTML="";for(let i=0;i<WORD.length;i++){word.appendChild(el("div","stamp"+(picked[i]?" full":""),picked[i]?picked[i].ch:""));}}
  let pool=shuffle(WORD.split("").map((ch,i)=>({ch,i})));if(pool.map(p=>p.ch).join("")===WORD)pool.reverse();
  pool.forEach(p=>{const b=btn("btn",p.ch,()=>{
    if(picked.length>=WORD.length)return;picked.push(p);b.disabled=true;paint();
    if(picked.length===WORD.length){
      if(picked.map(x=>x.ch).join("")===WORD)setTimeout(openEnd,500);
      else{state.wrong++;fb.className="feedback bad";fb.textContent="Das ergibt noch kein Wort. Versuch es noch einmal!";fb.hidden=false;shakePage();
        setTimeout(()=>{picked.forEach(x=>x.btn.disabled=false);picked=[];paint();},900);}
    }});p.btn=b;letters.appendChild(b);});
  paint();page.appendChild(word);page.appendChild(letters);page.appendChild(fb);
  const row=el("div","row");
  row.appendChild(btn("btn","Letzten Buchstaben löschen",()=>{const p=picked.pop();if(p)p.btn.disabled=false;paint();fb.hidden=true;}));
  row.appendChild(btn("btn","Zurück zur Karte",hide));
  page.appendChild(row);show();
}
function openEnd(){
  state.done=true;document.getElementById("chipText").textContent="Expedition geschafft!";
  const min=Math.max(1,Math.round((Date.now()-state.start)/60000));
  page.innerHTML="";
  page.appendChild(el("p","eyebrow","Expedition geschafft"));
  page.appendChild(el("h1",null,"Du bist ein echter FORSCHER-Profi!"));
  page.appendChild(el("p","lead","Du hast acht Orte in Europa erforscht und deine Karte vollständig beschriftet. Zeige diesen Bildschirm deiner Lehrkraft."));
  const st=el("div","stats");
  st.innerHTML="<span>Stufe</span><span>"+(state.level===2?"▲ Dreieck":"● Kreis")+"</span><span>Lösungswort</span><span>FORSCHER</span><span>Fehlversuche</span><span>"+state.wrong+"</span><span>Zeit</span><span>ca. "+min+" Min.</span>";
  page.appendChild(st);
  const row=el("div","row");
  row.appendChild(btn("btn primary","Fertige Karte ansehen",hide));
  row.appendChild(btn("btn","Noch einmal spielen",()=>{
    state.level=null;state.solved={};state.order=[];state.wrong=0;state.done=false;state.revealed={};
    car.x=base[0];car.y=base[1];car.boat=true;stations.forEach(s=>s.armed=true);baseArmed=false;renderBook();openStart();}));
  page.appendChild(row);show();
}

buildWorld();
miniBase.getContext("2d").drawImage(world,0,0,W,H,0,0,MW,MH);
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(()=>({state:JSON.parse(JSON.stringify(state)),car:{x:car.x,y:car.y}}));}catch(_){}}
function boot(data){
  resize();
  if(data&&data.state&&data.state.level){
    Object.assign(state,data.state);car.x=data.car.x;car.y=data.car.y;car.boat=!isLandPx(car.x,car.y);
    stations.forEach(s=>{if(Math.hypot(s.x-car.x,s.y-car.y)<46)s.armed=false;});
    renderBook();if(state.done)openEnd();else hide();
  }else{renderBook();openStart();}
  requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{});}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data?hot.data:{});
})();
